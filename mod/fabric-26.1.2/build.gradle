plugins {
    id 'fabric-loom' version '1.15-SNAPSHOT'
}

version = '1.0.0'
group = 'com.rcraja.swapndie'

repositories {
    maven { url 'https://maven.fabricmc.net/' }
}

dependencies {
    // NOTE: 26.1.2 is a brand-new versioning epoch — double check these three
    // coordinates against https://modrinth.com/mod/fabric-api/versions before
    // your first build. The Replit prompt in README.md fetches the current
    // ones for you if they've moved on since this was written.
    minecraft "com.mojang:minecraft:26.1.2"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.18.4"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.148.2+26.1.2"
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

processResources {
    inputs.property "version", version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}
