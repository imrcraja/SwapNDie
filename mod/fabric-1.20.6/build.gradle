plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
}

version = '1.0.0'
group = 'com.rcraja.swapndie'

repositories {
    maven { url 'https://maven.fabricmc.net/' }
}

dependencies {
    // Double-check these two against https://modrinth.com/mod/fabric-api/versions
    // for 1.20.6 before your first build — the Replit prompt in README.md fetches
    // the current numbers for you.
    minecraft "com.mojang:minecraft:1.20.6"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.15.11"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.100.1+1.20.6"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

processResources {
    inputs.property "version", version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}
