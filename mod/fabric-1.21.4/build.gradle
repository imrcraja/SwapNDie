plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
}

version = '1.0.0'
group = 'com.rcraja.swapndie'

repositories {
    maven { url 'https://maven.fabricmc.net/' }
}

dependencies {
    // Double-check these two against https://modrinth.com/mod/fabric-api/versions
    // for 1.21.4 before your first build — the Replit prompt in README.md fetches
    // the current numbers for you.
    minecraft "com.mojang:minecraft:1.21.4"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.16.9"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.100.8+1.21.4"
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

processResources {
    inputs.property "version", version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}
